name: Public Release

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "New semantic version, for example 0.1.8"
        required: true
        type: string
      versionCode:
        description: "New monotonically increasing Android versionCode"
        required: true
        type: string
      releaseNotes:
        description: "Plain-text public release notes, one item per line"
        required: true
        type: string
      sourceSha:
        description: "Exact verified commit currently at refs/heads/main"
        required: true
        type: string
      dryRun:
        description: "Build and validate without publishing"
        required: true
        default: true
        type: boolean

concurrency:
  group: watchio-public-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare and validate public release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WATCHIO_PUBLIC_CERT_SHA256: ${{ vars.WATCHIO_PUBLIC_CERT_SHA256 }}
      WATCHIO_PUBLIC_KEYSTORE_BASE64: ${{ secrets.WATCHIO_PUBLIC_KEYSTORE_BASE64 }}
      WATCHIO_PUBLIC_KEYSTORE_PASSWORD: ${{ secrets.WATCHIO_PUBLIC_KEYSTORE_PASSWORD }}
      WATCHIO_PUBLIC_KEY_ALIAS: ${{ secrets.WATCHIO_PUBLIC_KEY_ALIAS }}
      WATCHIO_PUBLIC_KEY_PASSWORD: ${{ secrets.WATCHIO_PUBLIC_KEY_PASSWORD }}
      WATCHIO_VERSION_NAME: ${{ inputs.versionName }}
      WATCHIO_VERSION_CODE: ${{ inputs.versionCode }}
      WATCHIO_SOURCE_SHA: ${{ inputs.sourceSha }}
    steps:
      - name: Validate source and release inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$WATCHIO_SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "sourceSha must be a full commit SHA" >&2; exit 1; }
          MAIN_SHA="$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | cut -f1)"
          test "$WATCHIO_SOURCE_SHA" = "$MAIN_SHA" || { echo "sourceSha must exactly match current main" >&2; exit 1; }
          [[ "$WATCHIO_VERSION_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "versionName must use canonical X.Y.Z syntax" >&2; exit 1; }
          [[ "$WATCHIO_VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo "versionCode must be a positive integer" >&2; exit 1; }
          test -n "$WATCHIO_PUBLIC_CERT_SHA256" || { echo "Missing WATCHIO_PUBLIC_CERT_SHA256" >&2; exit 1; }
          test -n "$WATCHIO_PUBLIC_KEYSTORE_BASE64" || { echo "Missing WATCHIO_PUBLIC_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$WATCHIO_PUBLIC_KEYSTORE_PASSWORD" || { echo "Missing WATCHIO_PUBLIC_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$WATCHIO_PUBLIC_KEY_ALIAS" || { echo "Missing WATCHIO_PUBLIC_KEY_ALIAS" >&2; exit 1; }
          test -n "$WATCHIO_PUBLIC_KEY_PASSWORD" || { echo "Missing WATCHIO_PUBLIC_KEY_PASSWORD" >&2; exit 1; }
          TAG="v$WATCHIO_VERSION_NAME"
          if git ls-remote --exit-code --tags "https://github.com/${{ github.repository }}.git" "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists" >&2
            exit 1
          fi

      - name: Checkout exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sourceSha }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare public signing
        shell: bash
        run: |
          set -euo pipefail
          echo "$WATCHIO_PUBLIC_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/watchio-public.jks"
          echo "WATCHIO_PUBLIC_KEYSTORE_PATH=$RUNNER_TEMP/watchio-public.jks" >> "$GITHUB_ENV"

      - name: Test release tooling
        working-directory: native-android/testing/release
        run: python -m unittest -v test_prepare_release.py

      - name: Build public APK
        working-directory: native-android
        run: |
          chmod +x ./gradlew
          ./gradlew test lintRelease assembleRelease

      - name: Verify package, version, signature, and APK
        shell: bash
        run: |
          set -euo pipefail
          APK="native-android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "Release APK missing or empty" >&2; exit 1; }
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='com.iamskorpz.watchioiptv' versionCode='$WATCHIO_VERSION_CODE' versionName='$WATCHIO_VERSION_NAME'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          CERT="$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK" | python -c "import sys,re; m=re.search(r'certificate SHA-256 digest:\\s*([a-fA-F0-9]+)',sys.stdin.read()); print(m.group(1).lower() if m else '')")"
          EXPECTED="$(echo "$WATCHIO_PUBLIC_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT" = "$EXPECTED" || { echo "PUBLIC signing certificate mismatch" >&2; exit 1; }

      - name: Generate immutable stable metadata candidate
        shell: bash
        env:
          WATCHIO_RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/watchio-public-release"
          printf '%s\n' "$WATCHIO_RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
          python native-android/testing/release/prepare_release.py \
            --base-manifest native-android/update/stable.json \
            --apk native-android/app/build/outputs/apk/release/app-release.apk \
            --output-dir "$RUNNER_TEMP/watchio-public-release" \
            --version-name "$WATCHIO_VERSION_NAME" \
            --version-code "$WATCHIO_VERSION_CODE" \
            --source-sha "$WATCHIO_SOURCE_SHA" \
            --release-notes-file "$RUNNER_TEMP/release-notes.txt"
          test -s "$RUNNER_TEMP/watchio-public-release/Watchio-IPTV.apk"
          test -s "$RUNNER_TEMP/watchio-public-release/stable.json"
          (cd "$RUNNER_TEMP/watchio-public-release" && sha256sum --check SHA256SUMS.txt)

      - name: Upload validated dry-run bundle
        uses: actions/upload-artifact@v4
        with:
          name: watchio-public-${{ inputs.versionName }}-${{ inputs.sourceSha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/watchio-public-release/Watchio-IPTV.apk
            ${{ runner.temp }}/watchio-public-release/SHA256SUMS.txt
            ${{ runner.temp }}/watchio-public-release/SOURCE_SHA.txt
            ${{ runner.temp }}/watchio-public-release/stable.json

  publish:
    name: Publish approved public release
    if: ${{ !inputs.dryRun }}
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      WATCHIO_TAG: v${{ inputs.versionName }}
      WATCHIO_SOURCE_SHA: ${{ inputs.sourceSha }}
    steps:
      - name: Checkout exact verified main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sourceSha }}
          fetch-depth: 0

      - name: Download validated bundle
        uses: actions/download-artifact@v4
        with:
          name: watchio-public-${{ inputs.versionName }}-${{ inputs.sourceSha }}
          path: ${{ runner.temp }}/watchio-public-release

      - name: Revalidate bundle and live main
        shell: bash
        run: |
          set -euo pipefail
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$MAIN_SHA" = "$WATCHIO_SOURCE_SHA" || { echo "main changed after release preparation" >&2; exit 1; }
          test "$(cat "$RUNNER_TEMP/watchio-public-release/SOURCE_SHA.txt")" = "$WATCHIO_SOURCE_SHA"
          (cd "$RUNNER_TEMP/watchio-public-release" && sha256sum --check SHA256SUMS.txt)
          test ! -e native-android/update/update.json.lock

      - name: Publish immutable release assets
        shell: bash
        env:
          WATCHIO_RELEASE_NOTES: ${{ inputs.releaseNotes }}
        run: |
          set -euo pipefail
          printf '%s\n' "$WATCHIO_RELEASE_NOTES" > "$RUNNER_TEMP/public-release-notes.txt"
          gh release create "$WATCHIO_TAG" \
            --target "$WATCHIO_SOURCE_SHA" \
            --title "Watchio IPTV $WATCHIO_TAG" \
            --notes-file "$RUNNER_TEMP/public-release-notes.txt" \
            "$RUNNER_TEMP/watchio-public-release/Watchio-IPTV.apk" \
            "$RUNNER_TEMP/watchio-public-release/SHA256SUMS.txt"
          gh release view "$WATCHIO_TAG" --json assets --jq '.assets[].name' | grep -Fx 'Watchio-IPTV.apk'
          curl --fail --silent --show-error --location --head \
            "https://github.com/${{ github.repository }}/releases/download/$WATCHIO_TAG/Watchio-IPTV.apk" >/dev/null

      - name: Publish validated stable metadata
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/watchio-public-release/stable.json" native-android/update/stable.json
          git diff --check
          git add native-android/update/stable.json
          test "$(git diff --cached --name-only)" = "native-android/update/stable.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(android): publish stable $WATCHIO_TAG metadata"
          git push origin HEAD:refs/heads/main
